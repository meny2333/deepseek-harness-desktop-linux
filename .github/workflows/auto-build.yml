name: Linux 自动构建

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 目标架构
        type: choice
        options: [x64, arm64, all]
        default: x64
      formats:
        description: 打包格式（逗号分隔：appimage,deb,pacman,rpm，或 all）
        type: string
        default: all
      electron:
        description: Electron 模式
        type: choice
        options: [both, bundled, system]
        default: both
      package_jobs:
        description: 打包压缩线程数（留空用默认）
        type: string
        default: ""
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl tar xz-utils unzip coreutils binutils \
            python3 python3-venv python3-pip \
            rpm libarchive-tools zstd squashfs-tools xvfb

      - name: 安装 7-Zip 26.04（Ubuntu 的 p7zip 16.02 解不了新版 dmg）
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.04/7z2604-linux-x64.tar.xz
          sudo mkdir -p /opt/7zip
          sudo tar -xJf /tmp/7z.tar.xz -C /opt/7zip
          if ! /opt/7zip/7zz i >/dev/null 2>&1; then sudo cp -f /opt/7zip/7zzs /opt/7zip/7zz; fi
          sudo ln -sf /opt/7zip/7zz /usr/local/bin/7z
          sudo ln -sf /opt/7zip/7zz /usr/local/bin/7za
          7z | head -3

      - name: 逐项检查(dry-run)
        env:
          FORMATS: ${{ inputs.formats || 'all' }}
          ARCH: ${{ inputs.arch || 'x64' }}
          ELECTRON: ${{ inputs.electron || 'both' }}
        run: ./auto-build.sh --dry-run --formats "$FORMATS" --arch "$ARCH" --electron "$ELECTRON" --no-proxy

      - name: 构建安装包
        env:
          FORMATS: ${{ inputs.formats || 'all' }}
          ARCH: ${{ inputs.arch || 'x64' }}
          ELECTRON: ${{ inputs.electron || 'both' }}
          PACKAGE_JOBS: ${{ inputs.package_jobs }}
        run: |
          args=(--formats "$FORMATS" --arch "$ARCH" --electron "$ELECTRON" --no-proxy)
          if [ -n "$PACKAGE_JOBS" ]; then
            args+=(--package-jobs "$PACKAGE_JOBS")
          fi
          ./auto-build.sh "${args[@]}"

      - name: 产物列表
        if: always()
        run: |
          ls -lh dist/ || true
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          (cd dist && ls -lh --time-style=long-iso) >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-${{ inputs.arch || 'x64' }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
